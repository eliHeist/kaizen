{% extends 'base.html' %}
{% load static %}

{% block title %}Page not found | {{ site.site_name }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container grid items-center gap-12 lg:grid-cols-2">
        <div>
            <span class="kicker">Lost in the bush?</span>
            <h1 class="text-5xl font-black tracking-tight md:text-7xl">404</h1>
            <p class="mt-4 max-w-md text-lg text-grey-600">The page you’re looking for has wandered off the trail. Let’s get you back on track.</p>
            <div class="mt-8 flex flex-wrap gap-3">
                <a href="{% url 'main:home' %}" class="btn btn-primary">Back to home</a>
                <a href="{% url 'tours:list' %}" class="btn btn-outline">Browse tours</a>
            </div>
        </div>
        <img src="{% static 'img/lionafrica.webp' %}" alt="" class="aspect-surface w-full rounded-3xl object-cover">
    </div>
</section>
{% endblock %}
