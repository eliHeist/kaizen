<a href="{{ place.get_absolute_url }}" class="group relative block overflow-hidden rounded-2xl {{ class|default:'aspect-portrait' }}">
    <img src="{{ place.cover.url }}" alt="{{ place.name }}" loading="lazy" decoding="async"
         class="h-full w-full object-cover transition-transform duration-700 ease-out-quart group-hover:scale-105">
    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/10 to-transparent"></div>
    <div class="absolute inset-x-0 bottom-0 p-5 text-white">
        <p class="text-xs font-semibold uppercase tracking-widest text-primary-100">{{ place.destination.name }}</p>
        <h3 class="mt-1 text-xl font-semibold text-white">{{ place.name }}</h3>
        <p class="mt-2 line-clamp-2 text-sm text-white/80">{{ place.summary }}</p>
    </div>
</a>
