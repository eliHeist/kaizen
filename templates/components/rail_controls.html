<div class="hidden gap-2 md:flex">
    <button type="button" @click="scroll(-1)" :disabled="atStart" aria-label="Previous"
            class="grid size-11 place-content-center rounded-full ring-1 ring-current/25 transition hover:bg-primary-900 hover:text-white hover:ring-primary-900 disabled:opacity-30">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
    </button>
    <button type="button" @click="scroll(1)" :disabled="atEnd" aria-label="Next"
            class="grid size-11 place-content-center rounded-full ring-1 ring-current/25 transition hover:bg-primary-900 hover:text-white hover:ring-primary-900 disabled:opacity-30">
        <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </button>
</div>
