<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ site.site_name }}</title></head>
<body style="margin:0;padding:0;background:#f6f3ea;font-family:Arial,Helvetica,sans-serif;color:#2a2a2a;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f3ea;padding:24px 12px;">
    <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;">
            <tr><td style="background:#3f3f13;padding:20px 28px;color:#f0ea86;font-size:20px;font-weight:bold;">{{ site.site_name }}</td></tr>
            <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
                {% block body %}{% endblock %}
            </td></tr>
            <tr><td style="padding:18px 28px;background:#fbf9e6;font-size:12px;color:#616161;">
                {{ site.site_name }} · {{ site.address_line1 }}, {{ site.city }}, {{ site.country }}<br>
                {{ site.phone }} · WhatsApp {{ site.whatsapp }} · <a href="mailto:{{ site.email }}" style="color:#797931;">{{ site.email }}</a>
            </td></tr>
        </table>
    </td></tr>
</table>
</body>
</html>
