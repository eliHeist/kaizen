{% load static %}<!DOCTYPE html>
{# Standalone on purpose: no database queries, so it renders even when the site is broken. #}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Something went wrong | Kaizen Safaris</title>
    <link rel="stylesheet" href="{% static 'dist/bundle.css' %}">
</head>
<body class="grid min-h-screen place-items-center bg-sand p-6 text-center">
    <main class="max-w-md">
        <img src="{% static 'img/logo.webp' %}" alt="Kaizen Safaris" class="mx-auto h-24 w-auto">
        <h1 class="mt-8 text-3xl font-bold">Something went wrong</h1>
        <p class="mt-3 text-grey-600">We’re sorry, our server hit a bump in the road. Please try again in a moment.</p>
        <a href="/" class="btn btn-primary mt-8">Back to home</a>
    </main>
</body>
</html>
